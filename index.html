<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Command Center</title>
  <meta name="description" content="Morning dashboard with weather, tasks, GitHub PRs, and focus streak">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0d0d0d;
      --card-bg: #1a1a1a;
      --card-border: #2a2a2a;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #00d4aa;
      --accent-dim: #00a080;
      --danger: #ff6b6b;
      --success: #4caf50;
      --card-radius: 12px;
      --card-padding: 16px;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    
    .date-display {
      font-size: 1.1rem;
      font-weight: 600;
    }
    
    .refresh-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    
    .refresh-btn:hover { background: var(--accent-dim); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .refresh-btn svg { width: 18px; height: 18px; }
    
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Main grid */
    .dashboard {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    @media (min-width: 768px) {
      .dashboard {
        max-width: 800px;
        grid-template-columns: repeat(2, 1fr);
      }
      .card.weather { grid-column: span 2; }
    }
    
    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
    }
    
    .card-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-title .icon { font-size: 16px; }
    
    /* Weather Card */
    .weather-content {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .weather-icon {
      font-size: 48px;
      line-height: 1;
    }
    
    .weather-temp {
      font-size: 42px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .weather-details { flex: 1; }
    
    .weather-condition {
      font-size: 16px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .weather-loading, .weather-error {
      color: var(--text-muted);
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }
    
    .weather-error { color: var(--danger); }
    
    /* Tasks Card */
    .tasks-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .task-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 16px;
      min-height: 48px;
    }
    
    .task-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .task-add-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      min-width: 48px;
    }
    
    .task-add-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .task-list { list-style: none; }
    
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--bg);
      min-height: 48px;
    }
    
    .task-item.completed {
      opacity: 0.5;
    }
    
    .task-item.completed .task-text {
      text-decoration: line-through;
    }
    
    .task-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
      transition: all 0.2s;
    }
    
    .task-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    .task-checkbox svg {
      width: 14px;
      height: 14px;
      color: var(--bg);
      opacity: 0;
    }
    
    .task-checkbox.checked svg { opacity: 1; }
    
    .task-text {
      flex: 1;
      word-break: break-word;
    }
    
    .task-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      min-height: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .task-item:hover .task-delete { opacity: 1; }
    .task-delete:hover { color: var(--danger); background: rgba(255,107,107,0.1); }
    
    .task-delete svg { width: 18px; height: 18px; }
    
    .tasks-empty {
      color: var(--text-muted);
      text-align: center;
      padding: 24px;
      font-size: 14px;
    }
    
    .tasks-limit {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
    }
    
    /* GitHub Card */
    .github-pr-count {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .pr-badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 24px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
    }
    
    .pr-label {
      font-size: 16px;
      color: var(--text-muted);
    }
    
    .pr-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .pr-item {
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .pr-item a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    
    .pr-item a:hover { text-decoration: underline; }
    
    .github-connect, .github-error {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
    }
    
    .github-connect a {
      color: var(--accent);
      text-decoration: none;
    }
    
    .github-error { color: var(--danger); }
    
    .github-loading {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
    }
    
    /* Streak Card */
    .streak-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .streak-number {
      font-size: 64px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    
    .streak-label {
      font-size: 18px;
      color: var(--text-muted);
    }
    
    .streak-fire {
      font-size: 48px;
    }
    
    .streak-empty {
      color: var(--text-muted);
      font-size: 14px;
      padding: 16px;
      text-align: center;
    }
    
    /* PWA */
    @media (display-mode: standalone) {
      .header { padding-top: env(safe-area-inset-top, 16px); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="date-display" id="dateDisplay">Loading...</div>
    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Refresh
    </button>
  </header>
  
  <main class="dashboard">
    <!-- Weather Card -->
    <section class="card weather" aria-label="Weather">
      <h2 class="card-title"><span class="icon">🌤️</span> Weather</h2>
      <div id="weatherContent">
        <div class="weather-loading">Loading weather...</div>
      </div>
    </section>
    
    <!-- Tasks Card -->
    <section class="card tasks" aria-label="Priority Tasks">
      <h2 class="card-title"><span class="icon">📋</span> Priority Tasks</h2>
      <div class="tasks-input-row">
        <input type="text" class="task-input" id="taskInput" placeholder="Add a task..." maxlength="200" aria-label="New task">
        <button class="task-add-btn" id="taskAddBtn" aria-label="Add task">Add</button>
      </div>
      <ul class="task-list" id="taskList" aria-label="Task list"></ul>
      <div class="tasks-limit" id="tasksLimit"></div>
    </section>
    
    <!-- GitHub PRs Card -->
    <section class="card github" aria-label="GitHub Pull Requests">
      <h2 class="card-title"><span class="icon">🐙</span> Open Pull Requests</h2>
      <div id="githubContent">
        <div class="github-loading">Loading PRs...</div>
      </div>
    </section>
    
    <!-- Focus Streak Card -->
    <section class="card streak" aria-label="Focus Streak">
      <h2 class="card-title"><span class="icon">🔥</span> Focus Streak</h2>
      <div id="streakContent">
        <div class="streak-empty">No focus data yet</div>
      </div>
    </section>
  </main>
  
  <script>
    // ============ Constants ============
    const STORAGE_KEYS = {
      TASKS: 'dailycomm_tasks_v1',
      LAST_REFRESH: 'dailycomm_last_refresh_v1',
      FOCUS_HISTORY: 'focuszone_history_v1'
    };
    
    const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
    const WEATHER_PARAMS = {
      latitude: 1.3521,
      longitude: 103.8198,
      current_weather: true,
      hourly: 'relativehumidity_2m'
    };
    
    const MAX_VISIBLE_TASKS = 3;
    const GITHUB_API = 'https://api.github.com';
    
    // ============ State ============
    let tasks = [];
    
    // ============ DOM Elements ============
    const dateDisplay = document.getElementById('dateDisplay');
    const refreshBtn = document.getElementById('refreshBtn');
    const weatherContent = document.getElementById('weatherContent');
    const taskInput = document.getElementById('taskInput');
    const taskAddBtn = document.getElementById('taskAddBtn');
    const taskList = document.getElementById('taskList');
    const tasksLimit = document.getElementById('tasksLimit');
    const githubContent = document.getElementById('githubContent');
    const streakContent = document.getElementById('streakContent');
    
    // ============ Utility Functions ============
    function formatDate(date) {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }
    
    function getWMOIcon(code) {
      const icons = {
        0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
        45: '🌫️', 48: '🌫️',
        51: '🌧️', 53: '🌧️', 55: '🌧️',
        61: '🌧️', 63: '🌧️', 65: '🌧️',
        71: '🌨️', 73: '🌨️', 75: '🌨️',
        80: '🌦️', 81: '🌦️', 82: '🌦️',
        95: '⛈️', 96: '⛈️', 99: '⛈️'
      };
      return icons[code] || '❓';
    }
    
    function getWMODescription(code) {
      const descriptions = {
        0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
        45: 'Foggy', 48: 'Depositing rime fog',
        51: 'Light drizzle', 53: 'Moderate drizzle', 55: 'Dense drizzle',
        61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
        71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow',
        80: 'Slight rain showers', 81: 'Moderate rain showers', 82: 'Violent rain showers',
        95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Thunderstorm with heavy hail'
      };
      return descriptions[code] || 'Unknown';
    }
    
    // ============ Weather Functions ============
    async function fetchWeather() {
      const params = new URLSearchParams({
        latitude: WEATHER_PARAMS.latitude,
        longitude: WEATHER_PARAMS.longitude,
        current_weather: 'true'
      });
      
      const url = `${WEATHER_API}?${params.toString()}`;
      const response = await fetch(url);
      
      if (!response.ok) {
        throw new Error(`Weather API error: ${response.status}`);
      }
      
      return response.json();
    }
    
    function renderWeather(data) {
      const cw = data.current_weather;
      const icon = getWMOIcon(cw.weathercode);
      const condition = getWMODescription(cw.weathercode);
      
      weatherContent.innerHTML = `
        <div class="weather-content">
          <div class="weather-icon">${icon}</div>
          <div class="weather-temp">${Math.round(cw.temperature)}°C</div>
          <div class="weather-details">
            <div class="weather-condition">${condition}</div>
          </div>
        </div>
      `;
    }
    
    function renderWeatherError(message) {
      weatherContent.innerHTML = `<div class="weather-error">${message}</div>`;
    }
    
    // ============ Task Functions ============
    function loadTasks() {
      try {
        const stored = localStorage.getItem(STORAGE_KEYS.TASKS);
        tasks = stored ? JSON.parse(stored) : [];
      } catch (e) {
        tasks = [];
      }
    }
    
    function saveTasks() {
      localStorage.setItem(STORAGE_KEYS.TASKS, JSON.stringify(tasks));
    }
    
    function renderTasks() {
      const visible = tasks.filter(t => !t.completed).slice(0, MAX_VISIBLE_TASKS);
      const completed = tasks.filter(t => t.completed);
      const hidden = tasks.filter(t => !t.completed).slice(MAX_VISIBLE_TASKS);
      
      if (tasks.length === 0) {
        taskList.innerHTML = '<li class="tasks-empty">No tasks yet. Add one above!</li>';
        tasksLimit.textContent = '';
        return;
      }
      
      taskList.innerHTML = [...visible, ...completed, ...hidden].map((task, idx) => {
        const realIdx = tasks.findIndex(t => t.id === task.id);
        return `
          <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
            <button class="task-checkbox ${task.completed ? 'checked' : ''}" aria-label="${task.completed ? 'Mark incomplete' : 'Mark complete'}" data-action="toggle" data-id="${task.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
            <span class="task-text">${escapeHtml(task.text)}</span>
            <button class="task-delete" aria-label="Delete task" data-action="delete" data-id="${task.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </li>
        `;
      }).join('');
      
      const remaining = tasks.filter(t => !t.completed).length;
      const total = tasks.length;
      if (remaining > MAX_VISIBLE_TASKS) {
        tasksLimit.textContent = `${remaining - MAX_VISIBLE_TASKS} more tasks (complete some to see them)`;
      } else {
        tasksLimit.textContent = `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function addTask(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      
      tasks.unshift({
        id: Date.now().toString(),
        text: trimmed,
        completed: false,
        createdAt: new Date().toISOString()
      });
      
      saveTasks();
      renderTasks();
    }
    
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    }
    
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }
    
    // ============ GitHub Functions ============
    async function fetchGitHubPRs() {
      const token = getGitHubToken();
      if (!token) {
        throw new Error('no_token');
      }
      
      const headers = {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': `Bearer ${token}`
      };
      
      const response = await fetch(`${GITHUB_API}/user/pulls?state=open&per_page=10`, { headers });
      
      if (response.status === 401) {
        throw new Error('invalid_token');
      }
      
      if (!response.ok) {
        throw new Error(`GitHub API error: ${response.status}`);
      }
      
      return response.json();
    }
    
    function getGitHubToken() {
      // Check sessionStorage first, then env
      let token = sessionStorage.getItem('gh_token');
      if (token) return token;
      
      // Try to get from env variable passed in URL or set by page
      token = window.GITHUB_TOKEN || '';
      return token;
    }
    
    function setGitHubToken(token) {
      sessionStorage.setItem('gh_token', token);
    }
    
    function renderGitHubConnect() {
      githubContent.innerHTML = `
        <div class="github-connect">
          <p>Connect your GitHub account to see open PRs</p>
          <br>
          <input type="password" id="ghTokenInput" placeholder="Paste GITHUB_TOKEN here" 
                 style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg);color:var(--text);margin-bottom:12px">
          <button onclick="submitGitHubToken()" style="background:var(--accent);color:var(--bg);border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;min-height:48px">Connect</button>
          <br><br>
          <small style="color:var(--text-muted)">Token needs 'repo' scope for private repos</small>
        </div>
      `;
    }
    
    function submitGitHubToken() {
      const input = document.getElementById('ghTokenInput');
      if (input && input.value.trim()) {
        setGitHubToken(input.value.trim());
        refreshAll();
      }
    }
    
    function renderGitHubPRs(prs) {
      if (!prs || prs.length === 0) {
        githubContent.innerHTML = `
          <div class="github-pr-count">
            <span class="pr-badge">0</span>
            <span class="pr-label">Open Pull Requests</span>
          </div>
          <p style="color:var(--text-muted);text-align:center;padding:16px">No open PRs. Time to code! 🎉</p>
        `;
        return;
      }
      
      const prList = prs.slice(0, 5).map(pr => `
        <li class="pr-item">
          <a href="${pr.html_url}" target="_blank" rel="noopener">
            ${escapeHtml(pr.base?.repo?.full_name || 'Unknown repo')} #${pr.number}
          </a>
          <br>
          <small style="color:var(--text-muted)">${escapeHtml(pr.title || '')}</small>
        </li>
      `).join('');
      
      githubContent.innerHTML = `
        <div class="github-pr-count">
          <span class="pr-badge">${prs.length}</span>
          <span class="pr-label">Open Pull Request${prs.length !== 1 ? 's' : ''}</span>
        </div>
        <ul class="pr-list">${prList}</ul>
        ${prs.length > 5 ? `<p style="color:var(--text-muted);text-align:center;padding:8px"><small>Showing 5 of ${prs.length}</small></p>` : ''}
        <p style="text-align:center;margin-top:12px">
          <a href="https://github.com/pulls" target="_blank" style="color:var(--accent)">View all on GitHub →</a>
        </p>
      `;
    }
    
    function renderGitHubError(message) {
      if (message === 'no_token' || message === 'invalid_token') {
        renderGitHubConnect();
      } else {
        githubContent.innerHTML = `<div class="github-error">${escapeHtml(message)}</div>`;
      }
    }
    
    // ============ Streak Functions ============
    function calculateStreak() {
      try {
        const history = localStorage.getItem(STORAGE_KEYS.FOCUS_HISTORY);
        if (!history) return { streak: 0, days: [] };
        
        const data = JSON.parse(history);
        if (!Array.isArray(data)) return { streak: 0, days: [] };
        
        // Sort dates and find consecutive days
        const dates = data
          .filter(d => d.completed || d.focusTime > 0)
          .map(d => {
            const date = new Date(d.date);
            return date.toISOString().split('T')[0];
          });
        
        if (dates.length === 0) return { streak: 0, days: [] };
        
        // Get unique dates
        const uniqueDates = [...new Set(dates)].sort().reverse();
        
        // Calculate streak from today/yesterday
        let streak = 0;
        const today = new Date().toISOString().split('T')[0];
        const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        
        // Start from today or yesterday
        let startDate = uniqueDates[0];
        if (startDate !== today && startDate !== yesterday) {
          return { streak: 0, days: uniqueDates };
        }
        
        for (let i = 0; i < uniqueDates.length; i++) {
          const expected = new Date(startDate);
          expected.setDate(expected.getDate() - i);
          const expectedStr = expected.toISOString().split('T')[0];
          
          if (uniqueDates.includes(expectedStr)) {
            streak++;
          } else {
            break;
          }
        }
        
        return { streak, days: uniqueDates };
      } catch (e) {
        return { streak: 0, days: [] };
      }
    }
    
    function renderStreak() {
      const { streak } = calculateStreak();
      
      if (streak === 0) {
        streakContent.innerHTML = `
          <div class="streak-empty">
            Complete focus sessions to build your streak! 🔥
          </div>
        `;
        return;
      }
      
      streakContent.innerHTML = `
        <div class="streak-content">
          <div class="streak-number">${streak}</div>
          <div class="streak-label">
            day${streak !== 1 ? 's' : ''} in a row
            ${streak > 0 ? '<span class="streak-fire">🔥</span>' : ''}
          </div>
        </div>
      `;
    }
    
    // ============ Refresh Functions ============
    async function refreshAll() {
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');
      
      weatherContent.innerHTML = '<div class="weather-loading">Loading weather...</div>';
      githubContent.innerHTML = '<div class="github-loading">Loading PRs...</div>';
      
      // Update date
      dateDisplay.textContent = formatDate(new Date());
      
      // Fetch weather
      try {
        const weatherData = await fetchWeather();
        renderWeather(weatherData);
      } catch (e) {
        renderWeatherError('Could not load weather');
      }
      
      // Fetch GitHub PRs
      try {
        const prs = await fetchGitHubPRs();
        renderGitHubPRs(prs);
      } catch (e) {
        renderGitHubError(e.message);
      }
      
      // Update streak
      renderStreak();
      
      // Save refresh time
      localStorage.setItem(STORAGE_KEYS.LAST_REFRESH, new Date().toISOString());
      
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('spinning');
    }
    
    // ============ Event Handlers ============
    taskAddBtn.addEventListener('click', () => {
      addTask(taskInput.value);
      taskInput.value = '';
    });
    
    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addTask(taskInput.value);
        taskInput.value = '';
      }
    });
    
    taskList.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      
      if (action === 'toggle') toggleTask(id);
      if (action === 'delete') deleteTask(id);
    });
    
    refreshBtn.addEventListener('click', refreshAll);
    
    // ============ Initialize ============
    function init() {
      dateDisplay.textContent = formatDate(new Date());
      loadTasks();
      renderTasks();
      renderStreak();
      
      // Initial load without spinner
      (async () => {
        // Load weather
        try {
          const weatherData = await fetchWeather();
          renderWeather(weatherData);
        } catch (e) {
          renderWeatherError('Could not load weather');
        }
        
        // Load GitHub
        try {
          const prs = await fetchGitHubPRs();
          renderGitHubPRs(prs);
        } catch (e) {
          renderGitHubError(e.message);
        }
      })();
    }
    
    init();
  </script>
</body>
</html>
